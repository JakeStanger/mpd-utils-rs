[package]
name = "mpd-utils"
version = "0.2.1"
edition = "2024"
description = "Utilities for working with MPD servers, built on top of `mpd_client` and `tokio`"
license = "MIT"

[dependencies]
mpd_client = "1.4.1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "time"] }
tracing = "0.1.44"
futures = "0.3.32"